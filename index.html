<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #94a3b8;
      font-family: system-ui, sans-serif;
    }
    #msg {
      text-align: center;
      font-size: 1.1rem;
    }
    button {
      margin-top: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: none;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div id="msg">
    <div id="status">Opening...</div>
    <button id="openBtn" onclick="openInBlank()">Click to open</button>
  </div>

  <script>
    const RAW_URL = 'https://raw.githubusercontent.com/plane65k/chatify-public/main/index.html';
    let fetchedHtml = null;

    async function start() {
      const status = document.getElementById('status');
      const openBtn = document.getElementById('openBtn');

      try {
        status.textContent = 'Fetching...';
        const res = await fetch(RAW_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        fetchedHtml = await res.text();
        status.textContent = 'Opening about:blank...';

        // Try to open automatically
        const success = openInBlank();

        if (!success) {
          // Popup was blocked
          status.textContent = 'Popup blocked';
          openBtn.style.display = 'inline-block';
        }
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        console.error(err);
      }
    }

    function openInBlank() {
      if (!fetchedHtml) return false;

      const win = window.open('about:blank', '_blank');
      if (!win) return false; // blocked

      win.document.open();
      win.document.write(fetchedHtml);
      win.document.close();

      // Optional: close this launcher page after opening
      // window.close();

      document.getElementById('status').textContent = 'Opened successfully';
      document.getElementById('openBtn').style.display = 'none';
      return true;
    }

    // Start as soon as the page loads
    window.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
